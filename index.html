function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function msg(t){document.getElementById('err').textContent=t;}
async function go(){
 var pw=document.getElementById('pw').value;if(!pw)return;
 document.getElementById('btn').disabled=true;
 msg('驗證密碼中…');
 try{
  var e=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  msg('解密中…');
  var packed=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.c));
  P.c=null;                                   // 釋放密文，降低記憶體峰值
  var html;
  if(P.z){                                    // 有壓縮
    if(typeof DecompressionStream==='undefined'){
      msg('這台瀏覽器太舊（需 iOS 16.4+ / Chrome 80+）');
      document.getElementById('btn').disabled=false;return;
    }
    msg('解壓中…');
    var ds=new DecompressionStream('gzip');
    var stream=new Blob([packed]).stream().pipeThrough(ds);
    html=await new Response(stream).text();
  }else{
    html=new TextDecoder().decode(packed);
  }
  packed=null;
  document.open();document.write(html);document.close();
 }catch(err){
  msg('密碼錯誤（或解密失敗）');
  document.getElementById('btn').disabled=false;
 }
}
document.getElementById('pw').addEventListener('keydown',function(ev){if(ev.key==='Enter')go();});
